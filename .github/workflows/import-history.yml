name: Import original git history

on:
  push:
    paths:
      - ".github/import-ready"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete history from bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat .github/bundle-parts/part00.b64 \
              .github/bundle-parts/part01.b64 \
              .github/bundle-parts/part02.b64 \
              .github/bundle-parts/part03.b64 \
              .github/bundle-parts/part04.b64 \
              .github/bundle-parts/part05.b64 \
            | base64 -d > /tmp/repo.bundle
          git bundle verify /tmp/repo.bundle
          git clone /tmp/repo.bundle /tmp/imported
          cd /tmp/imported
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main:main
